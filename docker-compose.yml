services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: huellas
      POSTGRES_USER: huellas
      POSTGRES_PASSWORD: huellas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huellas -d huellas"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  web:
    # Desarrollo: el código se monta en vivo para que Next.js actualice la app
    # sin reconstruir la imagen después de cada cambio.
    build:
      context: .
      target: deps
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://huellas:huellas@db:5432/huellas?schema=public
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads-data:/app/.next/standalone/public/uploads
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres-data:
  uploads-data:
